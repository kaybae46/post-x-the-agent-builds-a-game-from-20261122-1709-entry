<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Catch — built from one prompt</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0618; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; width: 540px; height: 960px; max-width: 100vw; max-height: 100vh; }
  canvas { display: block; width: 100%; height: 100%; background: #0a0618;
           box-shadow: 0 0 60px rgba(255, 0, 170, .35); }
  #btn { position: absolute; left: 50%; top: 62%; transform: translate(-50%, -50%);
         font: 700 28px system-ui, sans-serif; color: #0a0618; background: #00f5d4;
         border: 0; border-radius: 999px; padding: 16px 42px; cursor: pointer;
         box-shadow: 0 0 30px rgba(0, 245, 212, .8); }
  #btn:hover { background: #5cffc9; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="540" height="960"></canvas>
  <button id="btn">▶ START</button>
</div>
<script>
"use strict";
// Neon Catch — a tiny browser game built from ONE prompt:
// "Build a tiny browser game in a single HTML file: 'Neon Catch' — a canvas game
//  where a glowing paddle at the bottom catches falling stars, +1 point per catch,
//  3 lives, game-over screen with restart. Dark neon style, arrow keys or
//  mouse/touch to move, start button to begin."
const cv = document.getElementById("game");
const ctx = cv.getContext("2d");
const btn = document.getElementById("btn");
const W = cv.width, H = cv.height;

const params = new URLSearchParams(location.search);
const DEMO = params.get("demo") === "1"; // autopilot: paddle chases the lowest star

let state = "ready"; // ready | playing | over
let score = 0, lives = 3, stars = [], spawnIn = 0, elapsed = 0;
const paddle = { x: W / 2 - 70, y: H - 90, w: 140, h: 20, speed: 520 };
let keys = {};

function reset() {
  score = 0; lives = 3; stars = []; spawnIn = 0; elapsed = 0;
  paddle.x = W / 2 - paddle.w / 2;
}

function spawnStar() {
  const r = 12 + Math.random() * 10;
  stars.push({
    x: 30 + Math.random() * (W - 60),
    y: -30, r: r,
    vy: 170 + Math.random() * 130 + elapsed * 2,
    hue: [45, 190, 315, 265][Math.floor(Math.random() * 4)],
    spin: Math.random() * Math.PI * 2,
    vr: (Math.random() - 0.5) * 3
  });
}

function star(cx, cy, r, rot, hue) {
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(rot);
  ctx.fillStyle = "hsl(" + hue + ", 100%, 65%)";
  ctx.shadowColor = "hsl(" + hue + ", 100%, 60%)"; ctx.shadowBlur = 22;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const rr = i % 2 === 0 ? r : r * 0.45;
    const a = i * Math.PI / 5 - Math.PI / 2;
    ctx[i === 0 ? "moveTo" : "lineTo"](Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function update(dt) {
  elapsed += dt;
  // move paddle: keys, pointer, or demo autopilot
  if (keys.ArrowLeft || keys.a) paddle.x -= paddle.speed * dt;
  if (keys.ArrowRight || keys.d) paddle.x += paddle.speed * dt;
  if (DEMO && stars.length) {
    let target = stars[0];
    for (const s of stars) if (s.y > target.y) target = s;
    const cx = paddle.x + paddle.w / 2;
    const dx = target.x - cx;
    paddle.x += Math.max(-paddle.speed * dt, Math.min(paddle.speed * dt, dx));
  }
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

  spawnIn -= dt;
  if (spawnIn <= 0) { spawnStar(); spawnIn = 0.45 + Math.random() * 0.5; }

  for (let i = stars.length - 1; i >= 0; i--) {
    const s = stars[i];
    s.y += s.vy * dt; s.spin += s.vr * dt;
    const px = paddle.x, py = paddle.y;
    if (s.y + s.r >= py && s.y - s.r <= py + paddle.h &&
        s.x >= px - s.r && s.x <= px + paddle.w + s.r) {
      score += 1; stars.splice(i, 1); continue;
    }
    if (s.y - s.r > H) {
      stars.splice(i, 1);
      lives -= 1;
      if (lives <= 0) { state = "over"; btn.textContent = "↻ PLAY AGAIN"; btn.style.display = "block"; }
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  // starfield background
  ctx.fillStyle = "#0a0618"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "rgba(255,255,255,.5)";
  for (let i = 0; i < 60; i++) {
    const x = (((Math.sin(i * 127.1) * 43758.5453) % 1) + 1) % 1 * W;
    const y = (((Math.sin(i * 311.7) * 12543.1234) % 1) + 1) % 1 * H;
    ctx.fillRect(x, y, 2, 2);
  }
  // HUD
  ctx.font = "700 34px system-ui, sans-serif";
  ctx.fillStyle = "#00f5d4";
  ctx.shadowColor = "#00f5d4"; ctx.shadowBlur = 14;
  ctx.fillText("SCORE " + score, 24, 52);
  ctx.fillStyle = "#ff2e88";
  ctx.shadowColor = "#ff2e88";
  let hearts = "";
  for (let i = 0; i < 3; i++) hearts += i < lives ? "♥ " : "♡ ";
  ctx.fillText(hearts, W - 24 - ctx.measureText(hearts).width, 52);
  ctx.shadowBlur = 0;

  if (state === "ready") {
    ctx.textAlign = "center";
    ctx.font = "800 64px system-ui, sans-serif";
    ctx.fillStyle = "#f15bb5";
    ctx.shadowColor = "#f15bb5"; ctx.shadowBlur = 30;
    ctx.fillText("NEON", W / 2, H / 2 - 90);
    ctx.fillStyle = "#00f5d4";
    ctx.shadowColor = "#00f5d4";
    ctx.fillText("CATCH", W / 2, H / 2 - 20);
    ctx.shadowBlur = 0;
    ctx.font = "400 26px system-ui, sans-serif";
    ctx.fillStyle = "#cfc4ff";
    ctx.fillText("Catch the falling stars.", W / 2, H / 2 + 40);
    ctx.fillText("Arrows / mouse / touch to move.", W / 2, H / 2 + 78);
    ctx.textAlign = "left";
  }

  if (state === "over") {
    ctx.textAlign = "center";
    ctx.font = "800 60px system-ui, sans-serif";
    ctx.fillStyle = "#ff2e88";
    ctx.shadowColor = "#ff2e88"; ctx.shadowBlur = 26;
    ctx.fillText("GAME OVER", W / 2, H / 2 - 60);
    ctx.shadowBlur = 0;
    ctx.font = "700 40px system-ui, sans-serif";
    ctx.fillStyle = "#00f5d4";
    ctx.fillText("SCORE " + score, W / 2, H / 2 + 10);
    ctx.textAlign = "left";
  }

  for (const s of stars) star(s.x, s.y, s.r, s.spin, s.hue);

  // paddle
  const grad = ctx.createLinearGradient(paddle.x, 0, paddle.x + paddle.w, 0);
  grad.addColorStop(0, "#f15bb5"); grad.addColorStop(0.5, "#00f5d4"); grad.addColorStop(1, "#9b5de5");
  ctx.fillStyle = grad;
  ctx.shadowColor = "#00f5d4"; ctx.shadowBlur = 24;
  ctx.beginPath();
  ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 10);
  ctx.fill();
  ctx.shadowBlur = 0;
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (state === "playing") update(dt);
  draw();
  requestAnimationFrame(loop);
}

btn.addEventListener("click", () => {
  if (state === "ready" || state === "over") {
    reset(); state = "playing"; btn.style.display = "none";
  }
});
window.addEventListener("keydown", (e) => { keys[e.key] = true; });
window.addEventListener("keyup", (e) => { keys[e.key] = false; });
cv.addEventListener("pointermove", (e) => {
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) * (W / r.width);
  paddle.x = Math.max(0, Math.min(W - paddle.w, x - paddle.w / 2));
});
if (DEMO) { reset(); state = "playing"; btn.style.display = "none"; }
requestAnimationFrame(loop);
</script>
</body>
</html>
